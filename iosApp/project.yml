# Coque iPhone de Sauve, générée par XcodeGen (`xcodegen generate`) : aucun .xcodeproj n'est commité.
# Toute l'appli vient du framework Shared compilé par Gradle depuis le module shared.
# Le widget SOS (SauveWidget) est une extension Swift à part, sans le framework commun.
name: Sauve
options:
  bundleIdPrefix: fr.sauve
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Sauve:
    type: application
    platform: iOS
    sources:
      - Sauve
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.sauve.app
        PRODUCT_NAME: Sauve
        INFOPLIST_FILE: Sauve/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework Shared
    dependencies:
      - target: SauveWidget
    preBuildScripts:
      - name: Compiler le module shared
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  SauveWidget:
    type: app-extension
    platform: iOS
    sources:
      - SauveWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.sauve.app.widget
        PRODUCT_NAME: SauveWidget
        INFOPLIST_FILE: SauveWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
